name: Verify

on:
  push:
    branches: [main, "change/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  product-contracts:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - if: matrix.node == 22 && runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: matrix.node == 22 && runner.os != 'Linux'
        run: npx playwright install chromium
      - if: matrix.node == 22
        run: npm run test:browser
      - if: failure() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
